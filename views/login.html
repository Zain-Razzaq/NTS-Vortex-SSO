<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{APP_NAME}}</title>
<style>
  :root {
    --bg: #0d0d0d;
    --card-bg: #171717;
    --border: #2a2a2a;
    --text: #f3f3f3;
    --muted: #9a9a9a;
    --accent: #ffffff;
    --input-bg: #1f1f1f;
    --error: #f36868;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
  }
  .logo {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }
  .logo img { height: 56px; width: 56px; border-radius: 14px; }
  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  p.sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: #555; }
  button {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent);
    color: #111;
    margin-bottom: 18px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    margin: 4px 0 18px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #1f1f1f; }
  .error {
    background: rgba(243, 104, 104, 0.1);
    border: 1px solid rgba(243, 104, 104, 0.35);
    color: var(--error);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 26px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="{{LOGO_URL}}" alt="logo" /></div>
    <h1>NTS Vortex</h1>
    <p class="sub">Sign in to continue</p>

    {{ERROR_BLOCK}}

    <form method="POST" action="/login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="divider">or continue with</div>

    <form method="GET" action="/auth/nts">
      <button type="submit" class="btn-secondary">Sign in with NTS CRM</button>
    </form>

    <footer>{{APP_NAME}} &copy; {{YEAR}}</footer>
  </div>
</body>
</html>
